[project]
name = "sensorfault-bench"
version = "0.1.0"
description = "SensorFault-Bench: robustness benchmarking for time series forecasting under sensor faults."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.34,<2",
    "boto3>=1.35,<2",
    "chronos-forecasting==2.2.2",
    "einops>=0.8,<1",
    "kaleido==0.2.1",
    "mlflow>=2.14,<3",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "plotly>=5.24,<6",
    "pyarrow>=17,<20",
    "pytorch-lightning>=2.4,<3",
    "pyyaml>=6,<7",
    "s3fs>=2024.10,<2027",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "torch>=2.5,<2.7",
    "transformers>=4.41,<5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "pytest>=7.4,<9",
    "ruff>=0.11,<0.12",
]

[tool.ruff]
target-version = "py310"
preview = true
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E302", "E305", "E306", "F821"]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
