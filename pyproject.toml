[project]
name = "sensorfault-bench"
version = "1.0.0"
description = "Robustness evaluation of time series forecasting under sensor faults in cyber-physical systems."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Windmann" },
    { name = "Philipp Wittenberg" },
    { name = "Gianluca Manca" },
    { name = "Marcel Dix" },
    { name = "Jens U. Brandt" },
    { name = "Oliver Niggemann" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.34,<2",
    "boto3>=1.35,<2",
    "chronos-forecasting==2.2.2",
    "einops>=0.8,<1",
    "kaleido==0.2.1",
    "mlflow>=2.14,<3",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "plotly>=5.24,<6",
    "pyarrow>=17,<20",
    "pytorch-lightning>=2.4,<3",
    "pyyaml>=6,<7",
    "s3fs>=2024.10,<2027",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "torch>=2.5,<2.7",
    "transformers>=4.41,<5",
]

[project.urls]
Homepage = "https://github.com/awindmann/SensorFault-Bench"
Repository = "https://github.com/awindmann/SensorFault-Bench"
Paper = "https://neurips.cc/virtual/2026/loc/paris/poster/138912"
Documentation = "https://github.com/awindmann/SensorFault-Bench/tree/main/docs"

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "pytest>=7.4,<9",
    "ruff>=0.11,<0.12",
    "tomli>=2,<3; python_version < '3.11'",
]

[tool.ruff]
target-version = "py310"
preview = true
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E302", "E305", "E306", "F821"]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
