      - ModernTCN
      - PatchTST
      - TSMixer
    ensemble:
      - DLinear
      - GRU
      - ModernTCN
      - PatchTST
      - TSMixer
    randomized_training:
      - DLinear
      - GRU
      - ModernTCN
      - PatchTST
      - TSMixer
    randomized_smoothing:
      - DLinear
      - GRU
      - ModernTCN
