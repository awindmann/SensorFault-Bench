# configs/benchmark_scope.yaml
# Benchmark display and applicability contract.
#
# Runtime membership still belongs to configs/defaults.yaml and recipe/model
# registries. This manifest records reporting labels, display order, and
# method/architecture applicability.

schema_version: 1

datasets:
  display_order:
    - BeijingAir_Tiantan
    - Penmanshiel_Hourly_WT08
    - ETTh1
    - traffic
  display_labels:
    BeijingAir_Tiantan: "Beijing Air Tiantan"
    Penmanshiel_Hourly_WT08: "Penmanshiel WT08"
    ETTh1: "ETTh1"
    traffic: "Traffic"

architectures:
  display_order:
    - DLinear
    - GRU
    - ModernTCN
    - PatchTST
    - TSMixer
    - SeasonalNaive
    - Chronos2
  display_labels:
    DLinear: "DLinear"
    GRU: "GRU"
    ModernTCN: "ModernTCN"
    PatchTST: "PatchTST"
    TSMixer: "TSMixer"
    SeasonalNaive: "Seasonal Naive"
    Chronos2: "Chronos-2"
  roles:
    method_comparison:
      - DLinear
      - GRU
      - ModernTCN
      - PatchTST
      - TSMixer
    baseline_only_reference:
      - SeasonalNaive
      - Chronos2

methods:
